// Debian's own choices install by themselves (unattended-upgrades' default
// list), and so do Brave's releases: the browser is what faces the internet.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
Unattended-Upgrade::Origins-Pattern {
  "origin=Brave Software,archive=stable";
};
