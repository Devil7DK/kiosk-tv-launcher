; The remote. Three boards are supported; each has a build for the case
; (sleeps between presses) and one for the desk (never sleeps, and keys typed
; in the serial monitor -- u d l r o b + - -- are sent as if pressed).

[env]
framework = arduino
monitor_speed = 115200
build_flags = -I../shared

; Seeed XIAO ESP32-S3: buttons to ground, battery on its BAT pads.
[xiao]
platform = espressif32 @ 8.0.0
board = seeed_xiao_esp32s3
build_flags =
  ${env.build_flags}
  -D REMOTE_BOARD_XIAO_S3
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:xiao]
extends = xiao

[env:xiao-bench]
extends = xiao
build_flags = ${xiao.build_flags} -D REMOTE_BENCH

; ESP32-S3-Zero (Waveshare design, ESP32-S3FH4R2): buttons to ground.
[s3zero]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}
  -D REMOTE_BOARD_S3_ZERO
  ; Serial goes over the board's own USB port.
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:s3zero]
extends = s3zero

[env:s3zero-bench]
extends = s3zero
build_flags = ${s3zero.build_flags} -D REMOTE_BENCH

; ESP-WROOM-32 30-pin DevKit: buttons to 3.3 V.
[devkit]
platform = espressif32 @ 8.0.0
board = esp32dev
build_flags = ${env.build_flags} -D REMOTE_BOARD_DEVKIT

[env:devkit]
extends = devkit

[env:devkit-bench]
extends = devkit
build_flags = ${devkit.build_flags} -D REMOTE_BENCH
