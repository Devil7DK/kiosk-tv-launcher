; The remote: an ESP-WROOM-32 30-pin DevKit on a LiPo cell.
[env]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I../shared

; In the case: sleeps between presses.
[env:release]

; On the desk over USB: never sleeps, and keys typed in the serial monitor
; (u d l r o b + -) are sent as if pressed.
[env:bench]
build_flags = ${env.build_flags} -D REMOTE_BENCH
